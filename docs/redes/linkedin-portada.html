    font-weight: 200 800;

  /* Colores del kit de marca (src/estilos/marca.css); el papel es blanco con el oro de la marca encima. */
  :root {
    --tinta: #17233f; --tinta-2: #4a5878; --oro-legible: #8b6500;
    --oro-inicio: #fed44c; --oro: #fbbf24; --oro-final: #fb973a;

  html, body { margin: 0; padding: 0; }
  body { width: 4200px; height: 700px; overflow: hidden; font-family: 'Manrope Variable', Arial, sans-serif; }
  .lienzo {
    position: relative; width: 4200px; height: 700px; overflow: hidden;
    background:
      radial-gradient(22% 70% at 87% 40%, rgba(251, 191, 36, 0.22), transparent 70%),
      linear-gradient(180deg, #fffdf8 0%, #fff6e3 100%);
  }
  svg { position: absolute; inset: 0; }
  .texto {
    position: absolute; left: 2180px; top: 62px; transform: translateX(-50%);
    width: 2600px; text-align: center;
  }
  .ante { color: var(--oro-legible); font-weight: 700; font-size: 40px; letter-spacing: 0.14em; text-transform: uppercase; }
  h1 { margin: 22px 0 0; color: var(--tinta); font-weight: 800; font-size: 150px; line-height: 1.02; letter-spacing: -0.025em; }
  h2 { margin: 6px 0 0; color: var(--oro-legible); font-weight: 600; font-style: italic; font-size: 104px; line-height: 1.05; letter-spacing: -0.02em; }
  .pie { margin-top: 30px; color: var(--tinta-2); font-weight: 600; font-size: 46px; }
  .web { position: absolute; right: 130px; bottom: 60px; color: var(--tinta); font-weight: 800; font-size: 44px; letter-spacing: 0.01em; }
  .web span { color: var(--oro-legible); }
